<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Portal Académico Ficticio</title>
</head>

<body>

    <h1>🎓 Portal Académico Ficticio</h1>

    <p>
        Entorno experimental de CyberRangeCore.
        No contiene información institucional real.
    </p>

    <h2>Inicio de sesión</h2>

    {% if error %}
        <p style="color:red;">
            {{ error }}
        </p>
    {% endif %}

    <form method="post" action="/login">

        <p>
            <label>Usuario:</label><br>
            <input
                type="text"
                name="username"
                required
            >
        </p>

        <p>
            <label>Contraseña:</label><br>
            <input
                type="password"
                name="password"
                required
            >
        </p>

        <button type="submit">
            Ingresar
        </button>

    </form>

</body>

</html>
