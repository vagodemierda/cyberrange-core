id: CR-001

name: "Acceso no autorizado a aplicación institucional"

description: >
  Escenario de entrenamiento para detección, clasificación,
  escalamiento y contención de un acceso no autorizado,
  integrando decisiones CSIRT con evidencia técnica real
  generada por el portal académico ficticio.

roles:
  - SOC_ANALYST
  - IR_LEAD

metrics:
  - TTD
  - TTE
  - TTC

runtime:
  reset_actions:
    - RESET_CONTAINMENT

technical_actions:
  GATE-002: CONTAINMENT_RESPONSE

injects:

  # ==================================================
  # FASE 1 - DETECCIÓN
  # ==================================================

  - id: INJ-001
    t_min: 0
    type: ALERT
    title: "Alerta: múltiples intentos de autenticación fallidos"
    body: >
      El sistema de monitoreo detectó un volumen anómalo
      de intentos fallidos de autenticación contra el
      portal académico ficticio.

    telemetry_condition:
      detector: AUTHENTICATION
      expected_status: ALERT
      window_minutes: 5
      failure_threshold: 3

  - id: INJ-002
    t_min: 0
    type: EVIDENCE
    title: "Evidencia complementaria: autenticaciones fallidas persistentes"
    body: >
      El monitoreo registra múltiples eventos LOGIN_FAILURE
      asociados al portal académico ficticio dentro de la
      ventana de observación. La recurrencia de los intentos
      requiere análisis por parte del SOC.

    telemetry_condition:
      detector: AUTHENTICATION
      expected_status: ALERT
      window_minutes: 5
      failure_threshold: 3

  # ==================================================
  # FASE 2 - RECONOCIMIENTO
  # ==================================================

  - id: GATE-000
    t_min: 0
    type: GATE
    title: "Decisión 0: Reconocimiento y clasificación"
    question: >
      Con base en la evidencia técnica disponible,
      ¿cómo clasifica el evento observado?
    role_required: SOC_ANALYST

    telemetry_condition:
      detector: AUTHENTICATION
      expected_status: ALERT
      window_minutes: 5
      failure_threshold: 3

    options:

      - key: CONFIRMAR
        label: "Reconocer como incidente de seguridad"
        score: 10
        outcome: >
          El evento es reconocido como incidente y puede
          continuar hacia el proceso de escalamiento.

      - key: SOSPECHOSO
        label: "Mantener como evento sospechoso"
        score: 4
        outcome: >
          Se mantiene observación adicional sin declarar
          formalmente el incidente, retrasando la respuesta.

      - key: DESCARTAR
        label: "Descartar como actividad normal"
        score: -10
        outcome: >
          El evento no es reconocido como incidente y
          no se inicia el proceso formal de respuesta.

  # --------------------------------------------------
  # CONSECUENCIAS DE CLASIFICACIÓN NO ÓPTIMA
  # --------------------------------------------------

  - id: INJ-002B
    t_min: 0
    type: UPDATE
    title: "Respuesta retrasada por clasificación incierta"
    body: >
      El evento permanece bajo observación sin ser declarado
      formalmente como incidente. La ausencia de activación del
      proceso de respuesta prolonga la exposición del servicio.

    condition:
      gate_id: GATE-000
      option: SOSPECHOSO

  - id: INJ-002C
    t_min: 0
    type: ALERT
    title: "Incidente no reconocido"
    body: >
      La actividad fue descartada como comportamiento normal.
      No se activa el procedimiento de escalamiento y el
      servicio permanece expuesto a nuevas acciones adversarias.

    condition:
      gate_id: GATE-000
      option: DESCARTAR

  # ==================================================
  # FASE 3 - ESCALAMIENTO
  # ==================================================

  - id: GATE-001
    t_min: 0
    type: GATE
    title: "Decisión 1: Escalamiento"
    question: >
      ¿Escala el incidente confirmado al Líder IR?
    role_required: SOC_ANALYST

    condition:
      gate_id: GATE-000
      option: CONFIRMAR

    options:

      - key: ESCALAR
        label: "Escalar inmediatamente"
        score: 10
        outcome: >
          Se activa la coordinación con el Líder IR
          para preparar la respuesta al incidente.

      - key: MONITOREAR
        label: "Monitorear sin escalar"
        score: 4
        outcome: >
          El incidente continúa bajo observación sin
          activar coordinación formal de respuesta.

      - key: IGNORAR
        label: "Ignorar"
        score: -10
        outcome: >
          No se activa la respuesta y el servicio
          continúa expuesto a la actividad adversaria.

  - id: INJ-003A
    t_min: 0
    type: UPDATE
    title: "Coordinación de respuesta activada"
    body: >
      El escalamiento fue recibido por el Líder IR.
      Se activa la coordinación de respuesta y el equipo
      prepara medidas de contención con base en la
      evidencia técnica disponible.

    condition:
      gate_id: GATE-001
      option: ESCALAR

  - id: INJ-003B
    t_min: 0
    type: EVIDENCE
    title: "Actividad persistente sin escalamiento"
    body: >
      El SOC mantiene el incidente bajo monitoreo sin
      escalarlo. La actividad adversaria continúa mientras
      no existe coordinación formal con el Líder IR.

    condition:
      gate_id: GATE-001
      option: MONITOREAR

  - id: INJ-003C
    t_min: 0
    type: ALERT
    title: "Respuesta omitida ante incidente confirmado"
    body: >
      El incidente confirmado no fue escalado ni atendido.
      El servicio continúa expuesto y aumenta la probabilidad
      de materialización de un acceso no autorizado.

    condition:
      gate_id: GATE-001
      option: IGNORAR

  # ==================================================
  # FASE 4 - COMPROMISO TÉCNICO
  # ==================================================

  # Ruta correcta de escalamiento.

  - id: INJ-004
    t_min: 0
    type: ALERT
    title: "Compromiso confirmado: acceso no autorizado"
    body: >
      La telemetría del portal académico ficticio confirma
      que el mecanismo de autenticación fue evadido y que
      se produjo un acceso no autorizado al servicio.

    condition:
      gate_id: GATE-001
      option: ESCALAR

    telemetry_condition:
      detector: COMPROMISE
      expected_status: COMPROMISED
      window_minutes: 10

  # Compromiso después de elegir únicamente monitorear.

  - id: INJ-004B
    t_min: 0
    type: ALERT
    title: "Compromiso durante monitoreo sin escalamiento"
    body: >
      Mientras el incidente permanecía únicamente bajo
      monitoreo, la telemetría confirmó una evasión del
      mecanismo de autenticación. La ausencia de escalamiento
      retrasó la coordinación de respuesta.

    condition:
      gate_id: GATE-001
      option: MONITOREAR

    telemetry_condition:
      detector: COMPROMISE
      expected_status: COMPROMISED
      window_minutes: 10

  # Compromiso después de ignorar el incidente.

  - id: INJ-004C
    t_min: 0
    type: ALERT
    title: "Compromiso materializado sin respuesta"
    body: >
      La actividad que no fue atendida derivó en un acceso
      no autorizado confirmado por telemetría. El incidente
      se materializó sin que se hubiera activado el proceso
      formal de respuesta.

    condition:
      gate_id: GATE-001
      option: IGNORAR

    telemetry_condition:
      detector: COMPROMISE
      expected_status: COMPROMISED
      window_minutes: 10

  # ==================================================
  # FASE 5 - CONTENCIÓN
  # ==================================================

  - id: GATE-002
    t_min: 0
    type: GATE
    title: "Decisión 2: Contención"
    question: >
      Ante el compromiso confirmado,
      ¿qué medida de contención autoriza?
    role_required: IR_LEAD

    condition:
      gate_id: GATE-001
      option: ESCALAR

    release_after:
      inject_id: INJ-004
      delay_min: 0

    options:

      - key: PARCIAL
        label: "Contención parcial (bloqueo IP + monitoreo)"
        score: 10
        outcome: >
          Bloquea técnicamente la dirección IP asociada
          al compromiso mientras mantiene disponible el
          servicio para otras fuentes.

      - key: TOTAL
        label: "Contención total (aislar autenticación)"
        score: 5
        outcome: >
          Aísla temporalmente el servicio de autenticación,
          reduciendo la exposición con mayor impacto sobre
          la disponibilidad.

      - key: NO_ACTUAR
        label: "No actuar"
        score: -10
        outcome: >
          No aplica medidas técnicas de contención y
          mantiene el servicio expuesto al compromiso.

  # --------------------------------------------------
  # CONSECUENCIAS DE CONTENCIÓN
  # --------------------------------------------------

  - id: INJ-005A
    t_min: 0
    type: UPDATE
    title: "Contención parcial aplicada"
    body: >
      La fuente asociada al compromiso fue bloqueada.
      El servicio permanece disponible mientras continúa
      el monitoreo del incidente.

    condition:
      gate_id: GATE-002
      option: PARCIAL

  - id: INJ-005B
    t_min: 0
    type: UPDATE
    title: "Servicio de autenticación aislado"
    body: >
      El mecanismo de autenticación fue aislado como
      medida de contención total. La exposición disminuye,
      aunque se afecta temporalmente la disponibilidad.

    condition:
      gate_id: GATE-002
      option: TOTAL

  - id: INJ-005C
    t_min: 0
    type: ALERT
    title: "Compromiso permanece sin contención"
    body: >
      No se aplicaron medidas técnicas de contención.
      El servicio permanece expuesto a nuevos intentos
      de acceso no autorizado.

    condition:
      gate_id: GATE-002
      option: NO_ACTUAR

evaluation:

  delay_penalty_per_min: 1

  expected_response_min:
    GATE-000: 2
    GATE-001: 2
    GATE-002: 5

  weights:
    GATE-000: 1.0
    GATE-001: 1.0
    GATE-002: 1.0

  performance_levels:

    - name: "Bajo"
      min_score: -999
      max_score: 10

    - name: "Medio"
      min_score: 11
      max_score: 22

    - name: "Alto"
      min_score: 23
      max_score: 30
